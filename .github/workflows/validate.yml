name: Validate catalog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate public catalog and phase-one evidence
        run: python3 scripts/build_site.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real browser search, filters, evidence and links
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site &
          npx playwright test tests/site.spec.cjs --workers=1
      - name: Save desktop and mobile UI acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: games-atlas-ui-evidence
          path: screenshots/
          if-no-files-found: ignore
