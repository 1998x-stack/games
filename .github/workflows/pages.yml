name: Deploy Games Atlas to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog
        run: python3 scripts/build_site.py --check
      - name: Generate public-only static site JSON
        run: python3 scripts/build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium for pre-publish browser gate
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Require full Games Atlas UI regression before publishing
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site &
          npx playwright test tests/site.spec.cjs --workers=1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Unit-test strict public URL smoke checker
        run: python3 -m unittest discover -s tests -p "test_public_pages.py" -v
      - name: Verify published HTTPS files match deployed revision
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/check_public_pages.py --base-url "$PAGES_URL" --revision "$SOURCE_SHA"
